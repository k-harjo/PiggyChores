<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PiggyChores – Child Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center text-gray-800">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full text-center">
        <h1 class="text-2xl font-bold mb-6">🐷 Select Your Name</h1>
        <div id="child-buttons" class="grid grid-cols-2 gap-4"></div>
    </div>

    <script>
        const container = document.getElementById("child-buttons");

        db.collection("users").where("role", "==", "child").get()
            .then(snapshot => {
                snapshot.forEach(doc => {
                    const child = doc.data();
                    const btn = document.createElement("button");
                    btn.innerText = child.name;
                    btn.className = "bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg";
                    btn.onclick = () => enterPIN(doc.id, child.name);
                    container.appendChild(btn);
                });
            });

        function enterPIN(childId, name) {
            const pin = prompt(`Hi ${name}! Enter your 4-digit PIN:`);

            db.collection("users").doc(childId).get()
                .then(doc => {
                    if (doc.exists && doc.data().pin === pin) {
                        localStorage.setItem("childId", childId);
                        localStorage.setItem("childName", name);
                        window.location.href = "child.html";
                    } else {
                        alert("Incorrect PIN. Try again!");
                    }
                });
        }
    </script>
</body>
