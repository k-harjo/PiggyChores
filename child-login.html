<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PiggyChores – Child Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center text-gray-800 p-4">
    <main class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full">
        <h1 class="text-2xl font-bold mb-2 text-center">🐷 Child Sign In</h1>
        <p class="text-sm text-gray-600 mb-5 text-center">Ask a parent for your family code and sign-in details.</p>
        <form id="child-login-form" class="space-y-3">
            <label class="block text-left text-sm font-medium" for="family-code">Family code</label>
            <input id="family-code" class="w-full border rounded px-3 py-2" autocomplete="username" required>
            <label class="block text-left text-sm font-medium" for="child-email">Email</label>
            <input id="child-email" type="email" class="w-full border rounded px-3 py-2" autocomplete="username" required>
            <label class="block text-left text-sm font-medium" for="child-password">Password</label>
            <input id="child-password" type="password" class="w-full border rounded px-3 py-2" autocomplete="current-password" required>
            <button id="login-button" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-lg" type="submit">Sign In</button>
            <p id="login-error" class="text-red-600 text-sm" role="alert"></p>
        </form>
    </main>
    <script>
        const form = document.getElementById("child-login-form");
        const errorMessage = document.getElementById("login-error");
        const loginButton = document.getElementById("login-button");

        // Do not carry a parent's session onto the child device.
        const clearPreviousSession = auth.signOut().catch(error => {
            console.error("Could not clear prior session:", error);
        });

        form.addEventListener("submit", async event => {
            event.preventDefault();
            errorMessage.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Signing in…";

            const parentId = document.getElementById("family-code").value.trim();
            const email = document.getElementById("child-email").value.trim();
            const password = document.getElementById("child-password").value;

            try {
                await clearPreviousSession;
                const credential = await auth.signInWithEmailAndPassword(email, password);
                const childDoc = await db.collection("users")
                    .doc(parentId)
                    .collection("children")
                    .doc(credential.user.uid)
                    .get();

                if (!childDoc.exists || childDoc.data().authUid !== credential.user.uid) {
                    await auth.signOut();
                    throw new Error("This account is not linked to that family. Ask a parent to check the family code and account UID.");
                }

                const child = childDoc.data();
                localStorage.setItem("parentId", parentId);
                localStorage.setItem("childId", childDoc.id);
                localStorage.setItem("childName", child.name || "");
                window.location.href = "child.html";
            } catch (error) {
                errorMessage.textContent = error.message || "Could not sign in. Check the details and try again.";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
